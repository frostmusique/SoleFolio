<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SoleFolio — Ton portfolio sneakers</title>
<meta name="theme-color" content="#FAF6F2" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/logo.png" type="image/png" />
<link rel="apple-touch-icon" href="assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css?v=3" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="assets/logo.png" alt="SoleFolio" class="brand-mark" id="logoTrigger" />
  </div>
  <div class="header-actions">
    <button id="resetBtn" class="btn-reset" aria-label="Réinitialiser le stock" title="Réinitialiser le stock">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 4v6h6M20 20v-6h-6M4.5 15a8 8 0 0014.5 3.4M19.5 9a8 8 0 00-14.5-3.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Reset
    </button>
    <button id="addBtn" class="btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      Ajouter
    </button>
  </div>
</header>

<main class="container">

  <section class="stats">
    <div class="stat-card">
      <p class="stat-label">Investi</p>
      <p class="stat-value" id="statInvested">0 €</p>
    </div>
    <div class="stat-card">
      <p class="stat-label">Valeur marché</p>
      <p class="stat-value" id="statValue">0 €</p>
    </div>
    <div class="stat-card">
      <p class="stat-label">Plus-value</p>
      <p class="stat-value" id="statGain">0 €</p>
    </div>
  </section>

  <div class="toolbar">
    <input type="search" id="searchInput" placeholder="Rechercher une paire…" />
    <select id="sortSelect">
      <option value="recent">Plus récent</option>
      <option value="gain">Plus-value ↓</option>
      <option value="value">Valeur marché ↓</option>
      <option value="name">Nom A→Z</option>
    </select>
  </div>

  <div id="emptyState" class="empty-state" hidden>
    <p>Aucune paire pour l'instant.</p>
    <p class="empty-sub">Ajoute ta première sneaker pour démarrer ton portfolio.</p>
  </div>

  <div id="grid" class="grid"></div>

</main>

<!-- Modal -->
<div id="modalOverlay" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Ajouter une paire</h2>
      <button id="closeModal" class="icon-btn" aria-label="Fermer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <form id="sneakerForm" class="modal-body">
      <input type="hidden" id="itemId" />

      <div class="scan-block">
        <label for="scanInput" class="btn-scan">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 8V6a2 2 0 012-2h2M4 16v2a2 2 0 002 2h2M20 8V6a2 2 0 00-2-2h-2M20 16v2a2 2 0 01-2 2h-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
          Scanner l'étiquette de la boîte
        </label>
        <input type="file" id="scanInput" accept="image/*" capture="environment" hidden />
        <p id="scanStatus" class="scan-status" hidden></p>
      </div>

      <label>Marque
        <input type="text" id="fBrand" placeholder="Nike, Adidas, Jordan…" />
      </label>
      <label>Modèle *
        <input type="text" id="fModel" list="modelSuggestions" placeholder="Air Jordan 1 Retro High" required autocomplete="off" />
        <datalist id="modelSuggestions"></datalist>
      </label>
      <label>Coloris
        <input type="text" id="fColorway" placeholder="Chicago / White Black Red" />
      </label>
      <div class="row2">
        <label>Taille (EU)
          <input type="text" id="fSize" placeholder="42" />
        </label>
        <label>Quantité
          <input type="number" id="fQuantity" min="1" value="1" />
        </label>
      </div>
      <label>URL de l'image
        <input type="url" id="fImage" placeholder="https://…" />
      </label>
      <div class="row2">
        <label>Date d'achat
          <input type="date" id="fDate" />
        </label>
        <label>Prix d'achat (€) — optionnel
          <input type="number" id="fPurchase" min="0" placeholder="150" />
        </label>
      </div>
      <label>Prix marché actuel (€) — optionnel
        <input type="number" id="fMarket" min="0" placeholder="220" />
      </label>
      <label>Notes
        <textarea id="fNotes" rows="2" placeholder="Deadstock, box damaged…"></textarea>
      </label>

      <button type="submit" class="btn-primary btn-full">Enregistrer</button>
    </form>
  </div>
</div>

<div id="logoLightbox" class="lightbox-overlay" hidden>
  <img src="assets/logo.png" alt="SoleFolio" class="lightbox-image" />
</div>

<script src="app.js?v=3"></script>
</body>
</html>
